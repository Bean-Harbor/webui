<button mat-stroked-button type="button" [attr.aria-expanded]="opened()" (click)="opened.set(!opened())">
  {{ (opened() ? 'Close recording' : 'View recording') | translate }}
</button>
@if (opened()) {
  <div class="recording">
    <video
      #video
      controls
      preload="metadata"
      [src]="src()"
      (loadedmetadata)="draw()"
      (timeupdate)="draw()"
      (seeking)="clear()"
      (seeked)="draw()"
    ></video>
    <canvas #overlay aria-hidden="true"></canvas>
  </div>
}
